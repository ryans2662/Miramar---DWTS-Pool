name = "ballroom-pool"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Set to your GitHub Pages origin once you know it, e.g. "https://yourname.github.io"
ALLOWED_ORIGIN = "https://ryans2662.github.io"

[[d1_databases]]
binding = "DB"
database_name = "ballroom-pool"
database_id = "47fb3e15-ef48-48ce-a3e2-751de0ceb6f1"

# Every 15 minutes: lock picks at showtime even with no visitors, then pull the week's results from Wikipedia.
[triggers]
crons = ["*/15 * * * *"]
