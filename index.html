<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miramar's DWTS Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEDF3; --paper:#FFFFFF; --ink:#221B35; --muted:#6B6580; --line:#DAD7E4;
  --rose:#B8325F; --rose-soft:#F6E3EA;
  --gold:#A8801F; --gold-soft:#F5ECD4;
  --silver:#6F7686; --silver-soft:#E8EAEF;
  --bronze:#9C5B34; --bronze-soft:#F3E4DA;
  --ok:#2F7A55;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121F; --paper:#211B2E; --ink:#EEEAF6; --muted:#A39CB8; --line:#342C45;
    --rose:#E0698F; --rose-soft:#3A2130;
    --gold:#D6B25A; --gold-soft:#342B17;
    --silver:#AEB4C2; --silver-soft:#2A2835;
    --bronze:#D08A5E; --bronze-soft:#35231A;
    --ok:#6CC495;
  }
}
:root[data-theme="dark"]{
  --bg:#16121F; --paper:#211B2E; --ink:#EEEAF6; --muted:#A39CB8; --line:#342C45;
  --rose:#E0698F; --rose-soft:#3A2130;
  --gold:#D6B25A; --gold-soft:#342B17;
  --silver:#AEB4C2; --silver-soft:#2A2835;
  --bronze:#D08A5E; --bronze-soft:#35231A;
  --ok:#6CC495;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:1220px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand h1{font:700 clamp(2.2rem,6vw,3.4rem)/1 var(--display);margin:0;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted)}
.weekmark{font:500 1.05rem var(--display);color:var(--muted);text-align:right}
.weekmark b{display:block;font:700 2.6rem/1 var(--display);color:var(--ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 .98rem var(--body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--rose)}
@media (max-width:480px){nav.tabs{gap:0;overflow-x:auto}nav.tabs button{padding:10px 8px;white-space:nowrap}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.rose{background:var(--rose);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:.93rem}
.msg{padding:12px 16px;border-radius:10px;background:var(--rose-soft);margin:0 0 18px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input[type=number]{width:84px}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
@media (max-width:760px){.tiers{grid-template-columns:1fr}}
.tier{background:var(--paper);border-radius:14px;padding:16px 14px 12px;border-top:5px solid var(--tc)}
.tier h2{font:700 1.35rem var(--display);margin:0 0 2px}
.tier .sub{color:var(--muted);font-size:.86rem;margin-bottom:10px}
.t-top{--tc:var(--gold);--ts:var(--gold-soft)}
.t-mid{--tc:var(--silver);--ts:var(--silver-soft)}
.t-low{--tc:var(--bronze);--ts:var(--bronze-soft)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--ts)}
.opt[aria-pressed="true"]{background:var(--ts);border-color:var(--tc)}
.opt:disabled{cursor:default}
.opt .who{flex:1;min-width:0}
.opt .who b{display:block;font-weight:600}
.opt .who span{color:var(--muted);font-size:.85rem}
.paddle{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--display);background:var(--ts,var(--silver-soft));color:var(--ink);border:2px solid var(--tc,var(--silver))}
.paddle.none{font:500 .75rem var(--body);color:var(--muted)}
.submitbar{background:var(--paper);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.submitbar input{flex:1;min-width:180px}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--paper);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.88rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rank{font:700 1.1rem var(--display);width:40px}
.lead td{background:var(--gold-soft)}
.total{font:700 1.15rem var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 12px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h3{font:700 1.3rem var(--display);margin:30px 0 10px}
.rules ul{margin:0;padding-left:1.2em}
.rules li{margin:6px 0}
.pk{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.pks{display:flex;gap:6px 16px;flex-wrap:wrap}
.tiers.one{grid-template-columns:1fr}
.t-open{--tc:var(--rose);--ts:var(--rose-soft)}

/* admin */
.panel{background:var(--paper);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h2{font:700 1.3rem var(--display);margin:0 0 10px}
.grid-scores{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center}
.grid-scores .h{color:var(--muted);font-size:.85rem;font-weight:600}
textarea{width:100%;min-height:220px;font-size:.92rem}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600}
.tag.open{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.locked{background:var(--rose-soft);color:var(--rose)}
.weekmark .locks{display:block;margin-top:4px;font:500 .82rem var(--body);color:var(--muted)}
.out{color:var(--muted);text-decoration:line-through}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.roster{background:var(--paper);border-radius:14px;padding:16px 16px 10px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.roster h2{font:700 1.3rem var(--display);margin:0}
.roster .sub{color:var(--muted);font-size:.86rem;margin:2px 0 10px}
.roster ol{list-style:none;margin:0;padding:0}
.roster li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.roster li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster li .pts{font:700 1rem var(--display);font-variant-numeric:tabular-nums}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.st.in{background:var(--ok)}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--ts,var(--silver-soft));display:grid;place-items:center;font:700 .9rem var(--display);color:var(--tc,var(--ink))}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opt .paddle{width:38px;height:38px;font-size:.9rem}
.auth{background:var(--paper);border-radius:14px;padding:18px;margin-bottom:20px}
.auth h2{font:700 1.3rem var(--display);margin:0 0 4px}
.linkbtn{background:none;border:0;padding:0;color:var(--rose);font-weight:600;cursor:pointer;text-decoration:underline}
.who-line{margin:0 0 16px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Miramar's DWTS Pool</h1><p id="howto">Pick one couple from each tier. Judges' scores decide the week.</p></div>
    <div class="weekmark" id="weekmark"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="layout"><main id="main"><p class="note">Loading the pool…</p></main><aside class="roster" id="roster" aria-label="Players"></aside></div>
</div>
<script>
(function(){
/* Set this to your Worker URL after `wrangler deploy`. */
   const API='https://ballroom-pool.ryans2662.workers.dev';

const TIERS=[{k:'top',label:'Top tier',cls:'t-top'},{k:'mid',label:'Middle tier',cls:'t-mid'},{k:'low',label:'Bottom tier',cls:'t-low'}];
const OPEN_AT=6; // at or below this many active couples, tiers drop and players pick any two
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=null,P=[],me=store.get('bp_me'),myWeeks={},adminPw=store.get('bp_admin'),adminOk=false,adminPicks={};
let tab='picks',actingAs='self',draft={},flash=null,standWeek=null,scoreWeek=null,busy=false,loadErr=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const wk=w=>String(w);
const castById=id=>S.cast.find(c=>c.id===id);
const lockTime=()=>S.lockAt?.[wk(S.currentWeek)]||null;
function pullStatus(w){
  const src=S.scoreSource?.[wk(w)],last=S.pull?.week===w?S.pull:null;
  if(src==='manual')return`Week ${w} scores were entered by hand, so automatic updates are off for this week. Pull from Wikipedia to turn them back on.`;
  if(src==='wikipedia')return`Week ${w} scores came from Wikipedia's season article${last?.ok?`, last checked ${esc(fmtTime(last.at))}`:''}. They keep updating for two days after the lock in case of corrections.`;
  if(last&&!last.ok)return`Waiting for week ${w} results from Wikipedia (checked ${esc(fmtTime(last.at))}): ${esc(last.note)}`;
  return`Once week ${w} is locked, scores and eliminations fill in automatically from Wikipedia's season article, checked every 15 minutes.`;
}
const fmtTime=iso=>new Date(iso).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
const localInput=iso=>{const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};

async function api(path,body){
  const r=await fetch(API+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  const d=await r.json().catch(()=>({error:'Unexpected response from the server.'}));
  if(!r.ok)throw new Error(d.error||'Request failed.');
  return d;
}
function applyView(d){S=d.state;P=d.players||[];if(d.adminPicks)adminPicks=d.adminPicks}

function activeIn(w){return S.cast.filter(c=>c.outWeek==null||c.outWeek>=w)}
function avgBefore(id,w){let s=0,n=0;for(const k of Object.keys(S.scores)){if(+k<w){const v=S.scores[k]?.[id];if(typeof v==='number'){s+=v;n++}}}return n?s/n:null}
function tiersFor(w){
  const act=activeIn(w).map(c=>({c,avg:avgBefore(c.id,w)}));
  act.sort((a,b)=>{if((a.avg==null)!==(b.avg==null))return a.avg==null?1:-1;if(a.avg!=null&&b.avg!==a.avg)return b.avg-a.avg;return S.cast.indexOf(a.c)-S.cast.indexOf(b.c)});
  const n=act.length,t=Math.ceil(n/3),m=Math.ceil((n-t)/2);
  return{top:act.slice(0,t),mid:act.slice(t,t+m),low:act.slice(t+m)};
}
const isOpen=w=>activeIn(w).length<=OPEN_AT;
const pickIds=p=>p?(Array.isArray(p.open)?p.open:[p.top,p.mid,p.low]):[];
// A couple eliminated in week w earns their pickers nothing that week.
const outIn=(w,id)=>castById(id)?.outWeek===+w;
const pickPts=(w,id)=>{const v=S.scores[wk(w)]?.[id];return typeof v==='number'&&!outIn(w,id)?v:0};
const champPts=(w,p)=>S.finaleWeek!=null&&+w===S.finaleWeek&&S.champion&&p?.champ===S.champion?(S.champBonus??25):0;
const weekTotal=(w,p)=>p?pickIds(p).reduce((s,id)=>s+pickPts(w,id),0)+champPts(w,p):0;
function standings(){
  const weeks=Object.keys(S.locks||{}).map(Number).filter(w=>S.scores[wk(w)]).sort((a,b)=>a-b),rows={};
  for(const w of weeks)for(const [key,p] of Object.entries(S.locks[wk(w)])){
    rows[key]??={name:p.name,byWeek:{},total:0};const t=weekTotal(w,p);rows[key].byWeek[w]=t;rows[key].total+=t;rows[key].name=p.name}
  return{weeks,rows:Object.values(rows).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name))};
}
const flashHtml=()=>flash?`<div class="msg ${flash.ok?'ok':''}">${esc(flash.text)}</div>`:'';

/* ---------- render ---------- */
function render(){
  $('tabs').innerHTML=[['picks','Picks'],['standings','Standings'],['rules','Rules'],['admin','Commissioner']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('');
  if(!S){$('main').innerHTML=`<p class="note">${esc(loadErr||'Loading the pool…')}</p>`;return}
  $('howto').textContent=`${isOpen(S.currentWeek)?'Final stretch: pick any two couples':'Pick one couple from each tier'}${S.finaleWeek===S.currentWeek?', plus a champion':''}. Judges' scores decide the week.`;
  $('weekmark').innerHTML=`Season 35<b>Week ${S.currentWeek}</b>${S.locked?'<span class="tag locked">Picks locked</span>':'<span class="tag open">Picks open</span>'}${!S.locked&&lockTime()?`<span class="locks">Locks ${esc(fmtTime(lockTime()))}</span>`:''}`;
  if(tab==='picks')renderPicks();else if(tab==='standings')renderStandings();else if(tab==='rules')renderRules();else renderAdmin();
  renderRoster();
}
function renderRoster(){
  const totals={};
  for(const w of Object.keys(S.locks||{}))if(S.scores[w])for(const [id,p] of Object.entries(S.locks[w]))totals[id]=(totals[id]||0)+weekTotal(+w,p);
  const w=wk(S.currentWeek),locked=S.locked?(S.locks[w]||{}):null;
  const rows=P.map(p=>({...p,pts:totals[p.id]||0,inNow:locked?!!locked[p.id]:p.picked})).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
  const nIn=rows.filter(r=>r.inNow).length;
  $('roster').innerHTML=`<h2>Players</h2><div class="sub">${rows.length?`${nIn} of ${rows.length} ${S.locked?'locked in':'picked'} for week ${S.currentWeek}`:'No one has joined yet.'}</div>
    <ol>${rows.map(r=>`<li><span class="st ${r.inNow?'in':''}" title="${r.inNow?'Picked':'Not picked yet'}"></span><span class="nm">${esc(r.name)}</span><span class="pts">${r.pts}</span></li>`).join('')}</ol>`;
}
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const safeImg=u=>/^https:\/\/[^\s"'<>]+$/.test(u||'')?u:'';
function currentPick(){
  const w=wk(S.currentWeek);
  if(actingAs==='self')return myWeeks[w]||null;
  return adminPicks[actingAs]||null;
}
function renderPicks(){
  const w=S.currentWeek,T=tiersFor(w);
  const lockKey=actingAs==='self'?me?.id:actingAs;
  const lockedPick=S.locked?(S.locks[wk(w)]?.[lockKey]||null):null;
  const saved=currentPick();
  const sel=S.locked?(lockedPick||{}):{...(saved||{}),...draft};
  const canPick=!S.locked&&(actingAs!=='self'||me);
  let h=flashHtml();
  if(!me&&actingAs==='self'){
    h+=`<div class="auth"><h2>Join the pool</h2><p class="note">Pick a name and a 4 to 8 digit PIN. You'll use them to change your picks, so keep the PIN.</p>
      <div class="row"><input type="text" id="aname" placeholder="Name" maxlength="40" aria-label="Name"><input type="text" id="apin" inputmode="numeric" placeholder="PIN" maxlength="8" aria-label="PIN" style="width:110px">
      <button class="btn rose" id="join" ${busy?'disabled':''}>Join</button><button class="btn ghost" id="login" ${busy?'disabled':''}>Sign in</button></div></div>`;
  }else if(me&&actingAs==='self'){
    h+=`<p class="who-line">Picking as <b>${esc(me.name)}</b>. <button class="linkbtn" id="logout">Sign out</button></p>`;
  }
  if(adminOk&&P.length){
    h+=`<div class="row" style="margin-bottom:16px"><label for="acting">Entering picks for</label><select id="acting"><option value="self">${me?'Myself':'Nobody (browse)'}</option>${P.map(p=>`<option value="${esc(p.id)}" ${actingAs===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
  }
  if(S.locked)h+=`<div class="msg">Week ${w} picks are locked. ${lockedPick?'Your picks are highlighted below.':'Scores post after the show.'}</div>`;
  const open=isOpen(w),finale=S.finaleWeek===w,ranked=[...T.top,...T.mid,...T.low];
  const opt=(x,attr,on)=>`<button class="opt" ${attr} data-id="${esc(x.c.id)}" aria-pressed="${on}" ${canPick?'':'disabled'}>
      <span class="av" aria-hidden="true">${esc(initials(x.c.name))}${safeImg(x.c.photo)?`<img src="${esc(x.c.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>
      <span class="who"><b>${esc(x.c.name)}</b><span>${esc(x.c.pro||'')}</span></span>
      <span class="paddle ${x.avg==null?'none':''}" title="Season average">${x.avg==null?'new':x.avg.toFixed(1)}</span></button>`;
  if(open)h+=`<div class="tiers one"><section class="tier t-open"><h2>Final stretch</h2><div class="sub">${ranked.length} couples left. Pick any two.</div>`+
    ranked.map(x=>opt(x,'data-open="1"',(sel.open||[]).includes(x.c.id))).join('')+`</section></div>`;
  else h+=`<div class="tiers">`+TIERS.map(t=>`<section class="tier ${t.cls}"><h2>${t.label}</h2><div class="sub">${T[t.k].length} couples, ranked by season average</div>`+
    T[t.k].map(x=>opt(x,`data-tier="${t.k}"`,sel[t.k]===x.c.id)).join('')+`</section>`).join('')+`</div>`;
  if(finale)h+=`<div class="tiers one"><section class="tier t-top"><h2>Pick the champion</h2><div class="sub">Worth ${S.champBonus??25} bonus points if they win the finale.</div>`+
    ranked.map(x=>opt(x,'data-champ="1"',sel.champ===x.c.id)).join('')+`</section></div>`;
  if(canPick){
    const complete=(open?(sel.open||[]).length===2:TIERS.every(t=>sel[t.k]))&&(!finale||!!sel.champ);
    const nm=actingAs==='self'?me.name:(P.find(p=>p.id===actingAs)?.name||'');
    h+=`<div class="submitbar"><span style="flex:1">${actingAs==='self'?'Your picks':'Picks for <b>'+esc(nm)+'</b>'}</span>
      <button class="btn rose" id="savePicks" ${!complete||busy?'disabled':''}>${saved?'Update picks':'Save picks'}</button></div>
      <p class="note">${saved?`Saved. You can change your picks until ${lockTime()?esc(fmtTime(lockTime())):'the commissioner locks the week'}.`:`${open?'Choose two couples':'Choose one couple in each tier'}${finale?' and a champion':''}, then save.`}</p>`;
  }
  $('main').innerHTML=h;
}
function renderRules(){
  const w=S.currentWeek,bonus=S.champBonus??25,lt=lockTime();
  const now=isOpen(w)?`This is a final stretch week: pick any two couples.`:`This week has tiers: pick one couple from each.`;
  $('main').innerHTML=`<div class="rules">
  <div class="panel"><h2>Joining</h2><ul>
    <li>Join on the Picks tab with your name and a 4 to 8 digit PIN. Keep the PIN; you need it to sign in and change your picks.</li>
    <li>Lost your PIN? Ask the commissioner to reset it. You keep your picks and points.</li>
    <li>Rather text your picks to the commissioner? They can enter them for you.</li></ul></div>
  <div class="panel"><h2>Each week</h2><ul>
    <li>The couples still dancing are split into three tiers, top, middle, and bottom, ranked by their season average judges' score so far. Couples without a score yet rank below the rest, in cast order.</li>
    <li>Pick one couple from each tier. You can change your picks as often as you like until picks lock.</li>
    <li>Picks lock when the live show starts, Tuesday at 8:00 PM Eastern${lt?` (this week: ${esc(fmtTime(lt))})`:''}. If ABC moves the show, the commissioner moves the lock.</li>
    <li>Only the picks captured at the lock count. No picks at the lock means no points that week.</li>
    <li>${now}</li></ul></div>
  <div class="panel"><h2>Scoring</h2><ul>
    <li>Each couple earns their combined judges' total for the week, counting every dance they perform that week.</li>
    <li>Your week is the sum of your couples' totals. Your season is the sum of your weeks.</li>
    <li>Scores come in automatically after the show from the Scoring chart in Wikipedia's season article. The commissioner can correct any number, and their entry stands.</li>
    <li>Players with the same season total share a place in the standings.</li></ul></div>
  <div class="panel"><h2>Eliminations</h2><ul>
    <li>If a couple you picked is eliminated that week, you get no points for them that week, whatever the judges scored them.</li>
    <li>From the next week on, they drop out of the tiers and can't be picked.</li></ul></div>
  <div class="panel"><h2>Final stretch</h2><ul>
    <li>Once ${OPEN_AT} or fewer couples remain, the tiers drop. Pick any two different couples.</li>
    <li>Selecting a third couple replaces the one you picked first.</li></ul></div>
  <div class="panel"><h2>The finale</h2><ul>
    <li>In the finale week you also pick a champion, one of the couples still dancing. You can't save your picks without one.</li>
    <li>If your champion wins, you get ${bonus} bonus points on top of your couples' scores that week.</li></ul></div>
  </div>`;
}
function renderStandings(){
  const{weeks,rows}=standings();
  const lw=Object.keys(S.locks||{}).map(Number).sort((a,b)=>b-a);
  if(!lw.length){$('main').innerHTML=`<p class="note">Standings appear once a locked week has judges' scores.</p>`;return}
  if(!lw.includes(standWeek))standWeek=null; // null is the cumulative season view
  const ranks=vals=>{let prev=null,rank=0;return vals.map((v,i)=>{if(v!==prev){rank=i+1;prev=v}return rank})};
  let h=`<div class="row" style="margin-bottom:16px"><label for="standSel">View</label><select id="standSel"><option value="">Season (cumulative)</option>${lw.map(w=>`<option value="${w}" ${w===standWeek?'selected':''}>Week ${w}</option>`).join('')}</select></div>`;
  if(standWeek==null){
    if(!weeks.length){$('main').innerHTML=h+`<p class="note">Season standings appear once a locked week has judges' scores.</p>`;return}
    const rk=ranks(rows.map(r=>r.total));
    h+=`<div class="scroll"><table><thead><tr><th></th><th>Player</th>${weeks.map(w=>`<th class="num">Wk ${w}</th>`).join('')}<th class="num">Season</th></tr></thead><tbody>`+
      rows.map((r,i)=>`<tr class="${rk[i]===1?'lead':''}"><td class="rank">${rk[i]}</td><td>${esc(r.name)}</td>${weeks.map(w=>`<td class="num">${r.byWeek[w]??'–'}</td>`).join('')}<td class="num total">${r.total}</td></tr>`).join('')+`</tbody></table></div>`;
    $('main').innerHTML=h;return;
  }
  const L=S.locks[wk(standWeek)]||{},has=!!S.scores[wk(standWeek)];
  const ent=Object.values(L).sort((a,b)=>weekTotal(standWeek,b)-weekTotal(standWeek,a)||a.name.localeCompare(b.name));
  const rk=ranks(ent.map(p=>weekTotal(standWeek,p)));
  const pk=(id,cls)=>`<span class="pk ${cls}">${cls?'<span class="dot"></span>':''}${outIn(standWeek,id)?`<span class="out">${esc(castById(id)?.name||'—')}</span>`:esc(castById(id)?.name||'—')}${has?` <b>${pickPts(standWeek,id)}</b>${outIn(standWeek,id)?' <span class="note">eliminated</span>':''}`:''}</span>`;
  const champ=p=>standWeek===S.finaleWeek&&S.champion&&p.champ?`<span class="pk">Champion: ${esc(castById(p.champ)?.name||'—')} <b>+${champPts(standWeek,p)}</b></span>`:'';
  h+=`<div class="scroll"><table><thead><tr><th></th><th>Player</th><th>Picks</th><th class="num">Week ${standWeek}</th></tr></thead><tbody>`+
    ent.map((p,i)=>`<tr class="${has&&rk[i]===1?'lead':''}"><td class="rank">${has?rk[i]:''}</td><td>${esc(p.name)}</td><td><span class="pks">${Array.isArray(p.open)?p.open.map(id=>pk(id,'')).join(''):TIERS.map(t=>pk(p[t.k],t.cls)).join('')}${champ(p)}</span></td><td class="num total">${has?weekTotal(standWeek,p):'–'}</td></tr>`).join('')+
    `</tbody></table></div>${ent.length?'':`<p class="note">No one had picks in when week ${standWeek} locked.</p>`}${has?'':`<p class="note">Scores for week ${standWeek} aren't in yet.</p>`}`;
  $('main').innerHTML=h;
}
function renderAdmin(){
  let h=flashHtml();
  if(!adminOk){
    $('main').innerHTML=h+`<div class="auth"><h2>Commissioner</h2><div class="row"><input type="password" id="apw" placeholder="Commissioner password" aria-label="Commissioner password"><button class="btn" id="adminLogin" ${busy?'disabled':''}>Sign in</button></div></div>`;return}
  const w=S.currentWeek;if(scoreWeek==null)scoreWeek=w;
  const subs=P.filter(p=>p.picked).map(p=>p.name);
  h+=`<div class="panel"><h2>Week ${w}</h2>
    <p>${S.locked?`Picks are locked. ${Object.keys(S.locks[wk(w)]||{}).length} entries captured.`:`${subs.length} of ${P.length} players have picked${subs.length?': '+subs.map(esc).join(', '):''}.`}</p>
    <div class="row">${S.locked?`<button class="btn ghost" data-act="unlock">Reopen picks</button><button class="btn" data-act="nextWeek">Start week ${w+1}</button>`:`<button class="btn rose" data-act="lock">Lock picks</button>`}</div>
    <p class="note">Locking captures everyone's picks at that moment; scoring uses only what was captured.</p>
    ${S.locked?'':`<div class="row" style="margin-top:14px"><label>Picks lock at <input type="datetime-local" id="lockAt" value="${lockTime()?localInput(lockTime()):''}"></label>
      <button class="btn ghost" data-act="lockAt">Save lock time</button>${lockTime()?'<button class="btn ghost" data-act="lockManual">Lock by hand only</button>':''}</div>
    <p class="note">${lockTime()?`Picks lock automatically ${esc(fmtTime(lockTime()))}. New weeks default to the next live show, Tuesday 8:00 PM Eastern.`:'No automatic lock this week. Lock by hand, or set a time.'}</p>`}
    <div class="row" style="margin-top:14px"><label><input type="checkbox" id="finaleChk" ${S.finaleWeek===w?'checked':''} ${S.locked?'disabled':''}> Week ${w} is the finale</label>
      <label>Champion bonus <input type="number" id="champBonus" min="0" step="1" value="${S.champBonus??25}"></label>
      ${S.finaleWeek!=null?`<label>Champion <select id="champSel"><option value="">Not decided</option>${activeIn(S.finaleWeek).map(c=>`<option value="${esc(c.id)}" ${S.champion===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`:''}
      <button class="btn ghost" data-act="finale">Save finale settings</button></div>
    <p class="note">${S.finaleWeek!=null?`Week ${S.finaleWeek} is the finale. Players also pick a champion; a correct pick adds the bonus to that week.`:'Mark the finale week before opening picks so players can choose a champion.'}${S.locked?' The finale week can only be changed while picks are open.':''}</p></div>`;
  const act=activeIn(scoreWeek);
  h+=`<div class="panel"><h2>Judges' scores</h2><div class="row" style="margin-bottom:12px"><label for="sw">Week</label><select id="sw">${Array.from({length:w},(_,i)=>i+1).map(x=>`<option ${x===scoreWeek?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="grid-scores"><span class="h">Couple</span><span class="h">Score</span><span class="h">Eliminated</span>${act.map(c=>`<span>${esc(c.name)}</span><input type="number" min="0" step="1" data-score="${esc(c.id)}" value="${S.scores[wk(scoreWeek)]?.[c.id]??''}" aria-label="Score for ${esc(c.name)}"><input type="checkbox" data-out="${esc(c.id)}" ${c.outWeek===scoreWeek?'checked':''} aria-label="${esc(c.name)} eliminated in week ${scoreWeek}">`).join('')}</div>
    <p class="note">Enter each couple's combined judges' total for the week, including every dance that week. A couple marked eliminated earns their pickers 0 that week and drops out of the tiers the following week.</p>
    <p class="note">${pullStatus(scoreWeek)}</p>
    <div class="row"><button class="btn" data-act="scores">Save week ${scoreWeek} scores</button><button class="btn ghost" data-act="pull">Pull week ${scoreWeek} from Wikipedia</button></div></div>`;
  h+=`<div class="panel"><h2>Players</h2><p class="note">Players join themselves from the Picks tab. Add someone here if you'll enter their picks for them. If someone loses their PIN, use Reset PIN and tell them the new one; their picks and points stay.</p>
    <div class="row">${P.map(p=>`<span class="chip">${esc(p.name)}${p.managed?' (you enter)':''} <button class="btn ghost" style="padding:0 8px;margin-left:4px" data-rpin="${esc(p.id)}" aria-label="Reset PIN for ${esc(p.name)}">${p.managed?'Set PIN':'Reset PIN'}</button><button class="btn ghost" style="padding:0 8px;margin-left:4px" data-rmp="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join('')||'<span class="note">No players yet.</span>'}</div>
    <div class="row" style="margin-top:12px"><input type="text" id="newp" placeholder="Player name" maxlength="40"><button class="btn ghost" data-act="addPlayer">Add player</button></div></div>`;
  const out=S.cast.filter(c=>c.outWeek!=null).sort((a,b)=>a.outWeek-b.outWeek);
  h+=`<div class="panel"><h2>Cast</h2><p class="note">One couple per line as <i>Celebrity | Pro | Photo link</i>. The photo link is optional; couples without one show initials. Before any scores exist, tiers follow this order.</p>
    ${out.length?`<p>Eliminated and removed from picks: ${out.map(c=>`<span class="out">${esc(c.name)}</span> (week ${c.outWeek})`).join(', ')}.</p>`:''}
    <textarea id="castTxt">${esc(S.cast.map(c=>[c.name,c.pro||'',c.photo||''].join(' | ').replace(/( \| )+$/,'')).join('\n'))}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="cast">Save cast</button><button class="btn ghost" id="adminLogout">Sign out</button></div></div>`;
  $('main').innerHTML=h;
}

/* ---------- actions ---------- */
async function run(fn,okText){
  busy=true;render();
  try{await fn();if(okText)flash={ok:true,text:typeof okText==='function'?okText():okText}}
  catch(e){flash={text:e.message}}
  busy=false;render();
}
async function admin(action,extra={}){applyView(await api('/api/admin',{password:adminPw,action,...extra}))}
async function refresh(){
  try{applyView(await api('/api/state'));loadErr=null}
  catch(e){if(!S)loadErr='Could not reach the pool server. Check the API address at the top of index.html.'}
  if(!document.activeElement?.matches('input,textarea,select'))render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;flash=null;render();return}
  if(b.dataset.tier){if(S.locked)return;draft[b.dataset.tier]=b.dataset.id;flash=null;renderPicks();return}
  if(b.dataset.open){if(S.locked)return;const id=b.dataset.id,cur=[...(draft.open||currentPick()?.open||[])];
    draft.open=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id].slice(-2);flash=null;renderPicks();return}
  if(b.dataset.champ){if(S.locked)return;draft.champ=b.dataset.id;flash=null;renderPicks();return}
  if(b.id==='join'||b.id==='login'){
    const name=$('aname').value.trim(),pin=$('apin').value.trim();
    return run(async()=>{const d=await api(b.id==='join'?'/api/join':'/api/login',{name,pin});me={id:d.id,name:d.name,pin};myWeeks=d.weeks||{};store.set('bp_me',me);await refresh()},()=>`Welcome, ${me.name}.`)}
  if(b.id==='logout'){me=null;myWeeks={};draft={};store.set('bp_me',null);flash=null;return render()}
  if(b.id==='savePicks'){
    const pick={...(currentPick()||{}),...draft};
    return run(async()=>{
      if(actingAs==='self'){const d=await api('/api/picks',{id:me.id,pin:me.pin,pick});myWeeks=d.weeks;await refresh()}
      else await admin('setPicks',{id:actingAs,pick});
      draft={};
    },`Week ${S.currentWeek} picks saved.`)}
  if(b.id==='adminLogin'){adminPw=$('apw').value;return run(async()=>{await admin('check');adminOk=true;store.set('bp_admin',adminPw)},'Signed in as commissioner.')}
  if(b.id==='adminLogout'){adminOk=false;adminPw=null;store.set('bp_admin',null);actingAs='self';flash=null;return render()}
  if(b.dataset.rpin){const p=P.find(x=>x.id===b.dataset.rpin);const pin=(prompt(`New PIN for ${p?.name} (4 to 8 digits):`)||'').trim();if(!pin)return;
    if(!/^\d{4,8}$/.test(pin)){flash={text:'PIN must be 4 to 8 digits.'};return render()}
    return run(()=>admin('resetPin',{id:b.dataset.rpin,pin}),`${p?.name}'s PIN is now ${pin}. Let them know; they sign in with their name and the new PIN.`)}
  if(b.dataset.rmp){const p=P.find(x=>x.id===b.dataset.rmp);if(!confirm(`Remove ${p?.name}? Their locked weeks stay in the standings.`))return;
    if(actingAs===b.dataset.rmp)actingAs='self';return run(()=>admin('removePlayer',{id:b.dataset.rmp}),`${p?.name} removed.`)}
  const a=b.dataset.act;if(!a)return;
  if(a==='lock')return run(()=>admin('lock'),()=>`Week ${S.currentWeek} locked with ${Object.keys(S.locks[wk(S.currentWeek)]||{}).length} entries.`);
  if(a==='unlock')return run(()=>admin('unlock'),()=>`Picks reopened. ${lockTime()?`They lock again ${fmtTime(lockTime())}.`:'Lock by hand, or set a new lock time.'}`);
  if(a==='lockAt'){const v=$('lockAt').value;if(!v)return;return run(()=>admin('lockAt',{at:new Date(v).toISOString()}),()=>S.locked?`Week ${S.currentWeek} locked.`:`Picks lock ${fmtTime(lockTime())}.`)}
  if(a==='lockManual')return run(()=>admin('lockAt',{at:null}),'Automatic lock turned off for this week.');
  if(a==='nextWeek'){if(!S.scores[wk(S.currentWeek)]&&!confirm(`Week ${S.currentWeek} has no scores yet. Start week ${S.currentWeek+1} anyway?`))return;
    return run(async()=>{await admin('nextWeek');scoreWeek=S.currentWeek;draft={}},()=>`Week ${S.currentWeek} is open for picks.`)}
  if(a==='pull')return run(()=>admin('pull',{week:scoreWeek}),`Week ${scoreWeek} results pulled from Wikipedia.`);
  if(a==='scores'){const scores={},out=[];
    document.querySelectorAll('[data-score]').forEach(i=>{if(i.value!=='')scores[i.dataset.score]=Number(i.value)});
    document.querySelectorAll('[data-out]').forEach(i=>{if(i.checked)out.push(i.dataset.out)});
    return run(()=>admin('scores',{week:scoreWeek,scores,out}),`Week ${scoreWeek} scores saved.`)}
  if(a==='finale'){const extra={},bv=$('champBonus').value.trim();if(bv!=='')extra.bonus=Number(bv);if(!S.locked)extra.isFinale=$('finaleChk').checked;
    if($('champSel'))extra.champion=$('champSel').value||null;
    return run(()=>admin('finale',extra),'Finale settings saved.')}
  if(a==='addPlayer'){const name=$('newp').value.trim();if(!name)return;return run(()=>admin('addPlayer',{name}),`${name} added.`)}
  if(a==='cast'){const cast=$('castTxt').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[name,pro,photo]=l.split('|').map(s=>s.trim());return{name,pro,photo}});
    return run(()=>admin('cast',{cast}),()=>`Cast saved: ${S.cast.length} couples.`)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='acting'){actingAs=e.target.value;draft={};flash=null;renderPicks()}
  if(e.target.id==='sw'){scoreWeek=+e.target.value;renderAdmin()}
  if(e.target.id==='standSel'){standWeek=e.target.value?+e.target.value:null;renderStandings()}
});

/* ---------- boot ---------- */
render();
(async()=>{
  await refresh();
  if(me){try{const d=await api('/api/login',{id:me.id,pin:me.pin});myWeeks=d.weeks||{};me.name=d.name}catch{me=null;store.set('bp_me',null)}}
  if(adminPw){try{await admin('check');adminOk=true}catch{adminPw=null;store.set('bp_admin',null)}}
  render();
  setInterval(refresh,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
})();
</script>
</body>
</html>
